<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Results</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./css/results.css">
</head>



<h1>Výsledky</h1>

<body>

<div class="topbar">

  <div class="race-title">
    RALLY RESULTS
  </div>

  <div class="controls">

    <input
      id="race-id-input"
      placeholder="Race ID"
    >
    <button onclick="saveRaceId()">
      💾 Uložit zavod
    </button>

    <select id="stage-select">
      <option value="1">RZ1</option>
    </select>

    <button onclick="loadResults()">
      🔄 Načíst vysledky
    </button>

  </div>

</div>

<div class="results-layout">

  <!-- LEFT = STAGE -->
  <section class="results-panel">

    <h2 id="stage-title">
      Výsledky RZ
    </h2>

    <table id="results-table">

      <thead>
        <tr>
          <th>#</th>
          <th>Posádka</th>
          <th>Čas</th>
          <th>Ztráta</th>
          <th>Pen.</th>
        </tr>
      </thead>

      <tbody></tbody>

    </table>

  </section>

  <!-- RIGHT = OVERALL -->
  <section class="results-panel">

    <h2>
      Celkově po RZ
    </h2>

    <table id="overall-results-table">

      <thead>
        <tr>
          <th>#</th>
          <th>Posádka</th>
          <th>Celkem</th>
          <th>Ztráta</th>
        </tr>
      </thead>

      <tbody>

        <tr>
          <td colspan="4">
            Overall zatím není aktivní
          </td>
        </tr>

      </tbody>

    </table>

  </section>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="./js/common.js"></script>
<script src="./js/supabase.js"></script>
<script src="./js/results.js"></script>
