<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rally Timing Master</title>
  <link rel="stylesheet" href="./style-v2.css">
</head>

<body>
  <main class="timing-app">
    <div class="timing-shell">
      <nav class="app-nav">
        <button class="nav-btn active" onclick="showView('start')">Start</button>
        <button class="nav-btn" onclick="showView('finish')">Cíl</button>
        <button class="nav-btn" onclick="showView('results')">Log</button>
        <button class="nav-btn" onclick="showView('setup')">Nastavení</button>
      </nav>

      <header class="status-header">
        <div>
          <div class="eyebrow">Centrální čas</div>
          <div id="central-clock">00:00:00</div>
        </div>

        <div id="stage-info" class="stage-pill">
          Aktuální: <strong>RZ <span id="current-stage-num">1</span></strong>
        </div>
      </header>

      <section id="view-start" class="view active">
        <h2>Start RZ</h2>

        <div class="start-shell">
          <div id="start-display-box" class="start-display">
            <div class="metric-card">
              <div class="metric-label">Jezdec</div>
              <div id="active-rider-display" class="rider-display">--</div>
            </div>

            <div class="metric-card countdown-card">
              <div class="metric-label">Start za</div>
              <div id="countdown" class="countdown">--</div>
            </div>
          </div>

          <div class="rider-area">
            <label for="riderNumber">Startovní číslo</label>
            <input type="number" id="riderNumber" readonly placeholder="Číslo jezdce">

            <div class="keypad keypad-start">
              <button onclick="pressNum(1)">1</button>
              <button onclick="pressNum(2)">2</button>
              <button onclick="pressNum(3)">3</button>
              <button onclick="pressNum(4)">4</button>
              <button onclick="pressNum(5)">5</button>
              <button onclick="pressNum(6)">6</button>
              <button onclick="pressNum(7)">7</button>
              <button onclick="pressNum(8)">8</button>
              <button onclick="pressNum(9)">9</button>
              <button onclick="pressNum(0)">0</button>
              <button class="key-action danger" onclick="clearNum()">Oprava</button>
              <button class="key-action stop" onclick="clearNum()">Stop</button>
            </div>
          </div>
        </div>
      </section>

      <section id="view-finish" class="view">
        <h2>Cíl RZ</h2>

        <div class="finish-panel">
          <button id="finishBtn" class="finish-button">Projetí<br>cílem</button>
          <div id="recent-finishes" class="recent-finishes"></div>
        </div>

        <div id="finishModal" class="hidden modal-overlay">
          <div class="modal-panel">
            <h2>Číslo jezdce v cíli</h2>
            <input type="number" id="finishRiderInput" readonly>

            <div class="keypad modal-keypad">
              <button onclick="pressNum(1, 'finishRiderInput')">1</button>
              <button onclick="pressNum(2, 'finishRiderInput')">2</button>
              <button onclick="pressNum(3, 'finishRiderInput')">3</button>
              <button onclick="pressNum(4, 'finishRiderInput')">4</button>
              <button onclick="pressNum(5, 'finishRiderInput')">5</button>
              <button onclick="pressNum(6, 'finishRiderInput')">6</button>
              <button onclick="pressNum(7, 'finishRiderInput')">7</button>
              <button onclick="pressNum(8, 'finishRiderInput')">8</button>
              <button onclick="pressNum(9, 'finishRiderInput')">9</button>
              <button class="danger" onclick="clearNum('finishRiderInput')">C</button>
              <button onclick="pressNum(0, 'finishRiderInput')">0</button>
              <button class="success" onclick="confirmFinishRider()">OK</button>
            </div>

            <button class="secondary wide" onclick="document.getElementById('finishModal').classList.add('hidden')">
              Zrušit
            </button>
          </div>
        </div>
      </section>

      <section id="view-results" class="view">
        <h2>Log událostí</h2>

        <div class="button-row">
          <button onclick="downloadCSV()">Export CSV</button>
          <button id="upload-logs-btn" onclick="uploadLogsToFirebase()">Odeslat logy do Supabase</button>
        </div>

        <div id="log"></div>
      </section>

      <section id="view-setup" class="view">
        <h2>Nastavení</h2>

        <div class="setup-grid">
          <div class="setup-item">
            <label>Korekce času (ms)</label>
            <div class="stepper-row">
              <button onclick="adjustOffset(-1000)">-1s</button>
              <button onclick="adjustOffset(-100)">-0.1s</button>
              <span id="current-offset-display">0</span>
              <button onclick="adjustOffset(100)">+0.1s</button>
              <button onclick="adjustOffset(1000)">+1s</button>
            </div>
            <p>Slouží k synchronizaci s ostatními telefony.</p>
          </div>

          <div class="setup-item">
            <label for="device-role-select">Role zařízení</label>
            <select id="device-role-select" onchange="updateRole(this.value)">
              <option value="unassigned">-- Vyberte roli --</option>
              <option value="START">S - START</option>
              <option value="FINISH">F - CÍL</option>
            </select>
          </div>

          <div class="setup-item">
            <label for="race-id-input">ID závodu</label>
            <input
              type="number"
              id="race-id-input"
              placeholder="Zadej 5místné číslo"
              maxlength="5">
            <button class="wide" onclick="saveRaceId()">Potvrdit ID závodu</button>
            <div id="race-id-status" class="status-message">
              Zadej ID, které ti přidělil systém.
            </div>
          </div>

          <div class="setup-item">
            <label>Brána</label>
            <button id="connectArduino" class="wide">Připojit bránu</button>
          </div>

          <div class="setup-item">
            <label>Číslo RZ</label>
            <div class="stage-stepper">
              <button onclick="changeStage(-1)">-</button>
              <span id="setup-stage-num">1</span>
              <button onclick="changeStage(1)">+</button>
            </div>
          </div>

          <div class="setup-item">
            <label for="startInterval">Interval startů (sekundy)</label>
            <input type="number" id="startInterval" value="60">
          </div>

          <div class="setup-item danger-zone">
            <label>Správa dat</label>
            <button id="clear-data-btn" class="wide danger" onclick="confirmClearData()">
              SMAZAT VŠECHNY LOGY
            </button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="./js/supabase.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
