<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Rally Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Styl podobný timing app -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #0f0;
      margin: 0;
      padding: 0;
    }

    header {
      background: #000;
      padding: 10px;
      display: flex;
      justify-content: space-around;
      border-bottom: 2px solid #333;
    }

    .tab-btn {
      background: #222;
      border: none;
      color: #0f0;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 1rem;
    }

    .tab-btn.active {
      background: #004400;
    }

    .view {
      display: none;
      padding: 15px;
    }

    .view.active {
      display: block;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      background: #000;
      border: 1px solid #333;
      color: #0f0;
    }

    button {
      padding: 8px 12px;
      margin: 5px 0;
      background: #003366;
      color: #fff;
      border: none;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    td, th {
      border: 1px solid #333;
      padding: 6px;
      text-align: left;
    }

    th {
      background: #222;
    }


    .race-setup {
  padding: 15px;
  margin: 10px;
  border: 2px solid #006600;
  border-radius: 10px;
  text-align: center;
}

.race-setup input {
  width: 100%;
  font-size: 2.5rem;      /* 🔥 velké čísla */
  text-align: center;
  padding: 10px;
  margin: 10px 0;
  background: #222;
  color: #0f0;
  border: 1px solid #0f0;
  letter-spacing: 0.3em;  /* mezery mezi čísly */
}

.race-setup button {
  width: 100%;
  padding: 12px;
  font-size: 1.2rem;
  background: #004400;
  color: #0f0;
  border: 1px solid #0f0;
}
  </style>
</head>

<body>

<header>
  <button class="tab-btn active" onclick="showView('admin')">ADMINISTRACE</button>
  <button class="tab-btn" onclick="showView('itinerary')">ITINERÁŘ</button>
  <button class="tab-btn" onclick="showView('results')">VÝSLEDKY</button>
  
</header>

<div class="race-setup">
  <label>ID ZÁVODU</label>
  
  <input 
     type="text"
    id="race-id-input"
    maxlength="5"
    inputmode="numeric"
    pattern="[0-9]*"
    placeholder="12345"
  >

  <button onclick="saveRaceId()">✅ Potvrdit</button>
</div>

</div>

<!-- ================= ADMINISTRACE ================= -->
<div id="view-admin" class="view active">

  <h2>Startovní listina</h2>

  <input id="rider-number" placeholder="Číslo jezdce">
  <input id="rider-name" placeholder="Jméno a příjmení">
  <input id="co-driver" placeholder="Jezdec/Spolujezdec">
  <input id="nationality" placeholder="Národnost">
  <input id="car-brand" placeholder="Značka">
  <input id="car-model" placeholder="Model">
  <input id="category" placeholder="Kategorie">
  <input id="team" placeholder="Team">
  

  <div id="riders-status" style="margin:10px 0; font-size:0.9rem;"></div>

  <button id="save-rider-btn" onclick="addRider()">
  ➕ Přidat jezdce
</button>

<div style="margin-bottom:15px;">
  <input type="file" id="csv-file" accept=".csv">

  <button onclick="importCSV()">
    📥 Import CSV Napr.: Číslo;Závodník;Nár-Nár;Řidič-Spolujezdec;Značka;Model;Kategorie;Team
  </button>
</div>

  <!--
  <section id="view-admin" class="view active">-->

  <table id="riders-table">
    <thead>
      <tr>
        <th>#</th>
    <th>Jezdec</th>
    <th>Národnost</th>
    <th>Spolujezdec</th>
    <th>Auto</th>
    <th>Kategorie</th>
    <th>Tým</th>
    <th>Chip</th>
    <th>❌</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="riders-list"></div>
  <div id="riders-status">Načítám...</div>

</div>

<!-- ================= ITINERÁŘ ================= -->
<div id="view-itinerary" class="view">

  <h2>Itinerář</h2>

  <select id="it-type">
    <option value="stage">RZ</option>
    <option value="service">Servis</option>
    <option value="transfer">Přejezd</option>
  </select>

  <input id="it-label" placeholder="Popis (např. RZ1 START)">
  <input id="it-time" type="datetime-local">

  <button onclick="addItinerary()">➕ Přidat bod</button>

  <table id="itinerary-table">
    <thead>
      <tr>
        <th>Typ</th>
        <th>Popis</th>
        <th>Čas</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

</div>

<!-- ================= VÝSLEDKY ================= -->
<div id="view-results" class="view">

<h2>Výsledky</h2>

<select id="stage-select">
  <option value="1">RZ1</option>
  <option value="2">RZ2</option>
  <option value="3">RZ3</option>
</select>

<button onclick="loadResults()">🔄 Načíst výsledky</button>

<table id="results-table">
  <thead>
    <tr>
      <th>#</th>
      <th>Start. číslo</th>
      <th>Jezdec</th>
      <th>Auto</th>
      <th>Kategorie</th>
      <th>Čas</th>
      <th>Ztráta</th>
      <th>Penalizace</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="./js/supabase.js"></script>
<script src="./js/common.js"></script>
<script src="./js/admin.js"></script>
<script src="./js/results.js"></script>

</body>
</html>
