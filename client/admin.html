<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Rally Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./css/admin-classic.css">
</head>

<body>

<section id="admin-login" class="login-screen">
  <form id="admin-login-form" class="login-panel">
    <h1>Rally Admin</h1>
    <p class="login-note">Testovací přihlášení pro budoucí napojení na Azure. (heslo - admin)</p>

    <label for="admin-password">Heslo</label>
    <input
      id="admin-password"
      type="password"
      autocomplete="current-password"
      placeholder="Zadej heslo">

    <button type="submit">Přihlásit</button>
    <div id="admin-login-error" class="login-error" role="alert"></div>
  </form>
</section>

<main id="admin-app" class="admin-app" hidden>
  <div class="admin-shell">
    <div id="status-bar">
      <strong>RALLY ADMIN</strong>
      <span>Závod: <span id="current-race-display">-----</span></span>
      <span>Připojeno</span>
    </div>

    <div class="admin-nav-row">
      <header>
        <button class="tab-btn active" onclick="showView('race')">Závod</button>
        <button class="tab-btn" onclick="showView('riders')">Závodníci</button>
        <button class="tab-btn" onclick="showView('itinerary')">Itinerář</button>
        <button class="tab-btn" onclick="showView('categories')">Kategorie</button>
      </header>

      <button id="admin-logout-btn" class="logout-btn" type="button">Odhlásit</button>
    </div>

    <!-- ================= ZAVOD ================= -->
    <div id="view-race" class="view active">
      <h2>Závod</h2>

      <div class="form-grid compact-grid">
        <div>
          <label for="race-id-input">ID závodu</label>
          <input
            type="text"
            id="race-id-input"
            maxlength="5"
            inputmode="numeric"
            pattern="[0-9]*"
            placeholder="12345">
        </div>

        <button onclick="saveRaceId()">Potvrdit ID</button>
      </div>

      <div class="form-grid">
        <div>
          <label for="race-name">Název závodu</label>
          <input id="race-name" placeholder="Název závodu">
        </div>

        <div>
          <label for="race-location">Místo</label>
          <input id="race-location" placeholder="Místo konání">
        </div>

        <div>
          <label for="race-date">Datum</label>
          <input id="race-date" type="date">
        </div>

        <div>
          <label for="race-organizer">Pořadatel</label>
          <input id="race-organizer" placeholder="Pořadatel">
        </div>
      </div>

      <button onclick="saveRaceInfo()">Uložit údaje o závodu</button>
    </div>

    <!-- ================= ZAVODNICI ================= -->
    <div id="view-riders" class="view">
      <h2>Závodníci</h2>

      <div class="form-grid">
        <div>
          <label for="rider-number">Startovní číslo</label>
          <input id="rider-number" placeholder="Číslo jezdce">
        </div>

        <div>
          <label for="rider-name">Jméno a příjmení</label>
          <input id="rider-name" placeholder="Jméno a příjmení">
        </div>

        <div>
          <label for="co-driver">Posádka jezdec/spolujezdec</label>
          <input id="co-driver" placeholder="Jezdec/Spolujezdec">
        </div>

        <div>
          <label for="nationality">Národnost</label>
          <input id="nationality" placeholder="CZ/CZ">
        </div>

        <div>
          <label for="car-brand">Značka vozu</label>
          <input id="car-brand" placeholder="Škoda">
        </div>

        <div>
          <label for="car-model">Model vozu</label>
          <input id="car-model" placeholder="Fabia Rally2">
        </div>

        <div>
          <label for="category">Kategorie</label>
          <input id="category" placeholder="RC2">
        </div>

        <div>
          <label for="team">Tým</label>
          <input id="team" placeholder="Název týmu">
        </div>
      </div>

      <div id="riders-status" class="status-message">Načítám...</div>

      <div class="button-row">
        <button id="save-rider-btn" onclick="addRider()">Přidat jezdce</button>
      </div>

      <div class="import-row">
        <input type="file" id="csv-file" accept=".csv">
        <button onclick="importCSV()">Import CSV</button>
      </div>

      <div class="table-wrap">
        <table id="riders-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Jezdec</th>
              <th>Národnost</th>
              <th>Spolujezdec</th>
              <th>Auto</th>
              <th>Kategorie</th>
              <th>Tým</th>
              <th>Akce</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div id="riders-list"></div>
    </div>

    <!-- ================= ITINERAR ================= -->
    <div id="view-itinerary" class="view">
      <h2>Itinerář</h2>

      <div class="form-grid compact-grid">
        <div>
          <label for="it-type">Typ bodu</label>
          <select id="it-type">
            <option value="stage">RZ</option>
            <option value="service">Servis</option>
            <option value="transfer">Přejezd</option>
          </select>
        </div>

        <div>
          <label for="it-label">Popis</label>
          <input id="it-label" placeholder="Popis, např. RZ1 START">
        </div>

        <div>
          <label for="it-time">Čas</label>
          <input id="it-time" type="datetime-local">
        </div>

        <button onclick="addItinerary()">Přidat bod</button>
      </div>

      <div class="table-wrap">
        <table id="itinerary-table">
          <thead>
            <tr>
              <th>Typ</th>
              <th>Popis</th>
              <th>Čas</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- ================= KATEGORIE ================= -->
    <div id="view-categories" class="view">
      <h2>Kategorie</h2>

      <div class="form-grid compact-grid">
        <div>
          <label for="category-name">Název kategorie</label>
          <input id="category-name" placeholder="Název kategorie">
        </div>

        <button>Přidat kategorii</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Kategorie</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="categories-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="./js/supabase.js"></script>
<script src="./js/common.js"></script>
<script src="./js/admin.js"></script>

</body>
</html>
